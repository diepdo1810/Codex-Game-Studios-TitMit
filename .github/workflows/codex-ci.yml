name: Codex quick checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pixel-watering-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pixel-watering-browser-evidence
          path: test-results/
          if-no-files-found: ignore
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch pinned upstream source
        run: git fetch --no-tags --depth=1 https://github.com/Donchitos/Claude-Code-Game-Studios.git 05ad7c8a5b8aa2aa86bbd3439ae7cf7295cac418:refs/heads/source/ccgs-main
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node scripts/codex/ci.mjs
      - run: echo "Engine integration tests are PENDING; quick CI does not run engines."
  browser-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Scaffold Phaser
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cgs-web-game"
          bash .agents/scripts/web-scaffold.sh --root "$RUNNER_TEMP/cgs-web-game" --starter phaser --title "Web QA"
      - name: Install locked Web dependencies and Chromium
        shell: bash
        run: |
          cd "$RUNNER_TEMP/cgs-web-game"
          npm ci
          npx playwright install --with-deps chromium-headless-shell
      - name: Typecheck, build, unit and browser tests
        shell: bash
        run: |
          cd "$RUNNER_TEMP/cgs-web-game"
          npm run build
          npm test
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch pinned upstream source
        run: git fetch --no-tags --depth=1 https://github.com/Donchitos/Claude-Code-Game-Studios.git 05ad7c8a5b8aa2aa86bbd3439ae7cf7295cac418:refs/heads/source/ccgs-main
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - if: runner.os != 'Linux'
        run: node scripts/codex/ci.mjs
      - run: node scripts/codex/backend-tests.mjs --disposable-checkout
  node24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch pinned upstream source
        run: git fetch --no-tags --depth=1 https://github.com/Donchitos/Claude-Code-Game-Studios.git 05ad7c8a5b8aa2aa86bbd3439ae7cf7295cac418:refs/heads/source/ccgs-main
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: node scripts/codex/ci.mjs
      - run: node scripts/codex/backend-tests.mjs --disposable-checkout
