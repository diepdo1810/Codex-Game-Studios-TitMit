name: Codex quick checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node scripts/codex/ci.mjs
      - run: echo "Engine integration tests are PENDING; quick CI does not run engines."
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - if: runner.os != 'Linux'
        run: node scripts/codex/ci.mjs
      - run: node scripts/codex/backend-tests.mjs --disposable-checkout
  node24:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: node scripts/codex/ci.mjs
      - run: node scripts/codex/backend-tests.mjs --disposable-checkout
