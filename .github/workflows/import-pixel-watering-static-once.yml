name: Import approved Pixel Watering static sprite pack once
on:
  push:
    branches: [codex/pixel-watering-art-bible]
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify generated sprite pack
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3             'https://at.adobe.com/Me3u58YKkCQbhESQ' -o "$RUNNER_TEMP/pixel-water-static-v1.zip"
          echo '49c56645fe169c1815d90d5179e21e66bda5fb46c6534ee97067de9d235276d8  '"$RUNNER_TEMP"'/pixel-water-static-v1.zip' | sha256sum --check
          unzip -q "$RUNNER_TEMP/pixel-water-static-v1.zip" -d .
          sha256sum --check design/assets/production/pixel-watering-SHA256SUMS.txt
      - name: Validate runtime static sprite formats and layout data
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,struct
          root=Path('assets/images/pixel-watering')
          d=json.loads(Path('design/assets/production/pixel-watering-placements.json').read_text())
          assert d['canvas']==[180,320]
          assert len(d['assets'])==10
          assert len({x['file'] for x in d['assets']})==10
          assert hashlib.sha256((root/'env_garden_background_base_scene.png').read_bytes()).hexdigest()=='f192633e313be9aae3a45a8793bb49a9cf34b9dd7457f44b08d853047051af49'
          for row in d['assets']:
              p=root/row['file'];raw=p.read_bytes()
              assert raw[:8]==b'\x89PNG\r\n\x1a\n',p
              w,h=struct.unpack('>II',raw[16:24])
              assert (w,h)==(row['width'],row['height']),p
              assert 0<=row['scene_x']<180 and 0<=row['scene_y']<320,p
              assert row['scene_x']+w<=180 and row['scene_y']+h<=320,p
              print('PASS',row['asset'],str(p),w,h)
          print('PASS: 10 files / nine logical asset IDs; PNG headers; bounds; approved ASSET-001 hash')
          PY
      - name: Commit sprite PNGs and retained QA composite to the art branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/pixel-watering design/assets/production production/qa/evidence/pixel-watering-assets
          git diff --cached --check
          git commit -m 'art: add nine master-aligned static pixel watering assets'
          git push origin "HEAD:$GITHUB_REF_NAME"
