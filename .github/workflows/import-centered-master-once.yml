name: Import approved centered master scene once
on:
  push:
    branches:
      - codex/pixel-watering-art-bible
permissions:
  contents: write
jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import original approved master PNG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p design/art/references
          curl --fail --location --silent --show-error --retry 3             'https://at.adobe.com/V3YTN43NdSUkeRnL'             --output design/art/references/master-scene-v1.png
          echo 'c2aadc1c07ec5604b8af16128c4d6209b52113ef6a5c1d97156066f630ebf40b  design/art/references/master-scene-v1.png' | sha256sum --check
          file design/art/references/master-scene-v1.png
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add design/art/references/master-scene-v1.png
          git diff --cached --check
          git commit -m 'art: add centered plant as approved master scene'
          git push origin "HEAD:$GITHUB_REF_NAME"
